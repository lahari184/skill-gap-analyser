<!DOCTYPE html>
<html>
<head>
    <title>Roadmap Viewer</title>
</head>
<body>

<h2>Select Job Role</h2>

<form method="POST">
    <select name="job_role">
        <option value="software engineer">Software Engineer</option>
        <option value="data scientist">Data Scientist</option>
        <option value="web developer">Web Developer</option>
    </select>

    <button type="submit">Get Roadmap</button>
</form>

{% if error %}
    <p style="color: red; font-weight: bold;">{{ error }}</p>
{% endif %}

{% if pdf_file %}
    <h3>Roadmap for {{ job }}</h3>

    <!-- View PDF -->
    <iframe src="{{ url_for('static', filename='roadmaps/' + pdf_file) }}"
            width="600" height="400">
    </iframe>

    <br><br>

    <!-- Download button -->
    <a href="/download/{{ pdf_file }}">
        <button>Download Roadmap</button>
    </a>

{% endif %}

</body>
</html>
