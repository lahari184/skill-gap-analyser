<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job_role }} - Roadmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .roadmap-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .roadmap-viewer {
            width: 100%;
            height: 700px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-back:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .info-text {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .roadmap-viewer {
                height: 500px;
            }

            .header h1 {
                font-size: 24px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ job_role }} Roadmap</h1>
            <p>Your personalized learning path</p>
        </div>

        <div class="roadmap-section">
            <div class="info-text">
                📄 PDF Preview - Scroll through the roadmap below or download it for offline access
            </div>
            
            <iframe 
                class="roadmap-viewer"
                src="{{ url_for('static', filename='roadmaps/' + roadmap_file) }}#toolbar=0"
                type="application/pdf">
            </iframe>

            <div class="action-buttons">
                <a href="#" onclick="downloadAndRedirect(event)" class="btn btn-download">
                    ⬇️ Download Roadmap
                </a>
                <a href="{{ url_for('dashboard') }}" class="btn btn-back">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        function downloadAndRedirect(event) {
            event.preventDefault();
            
            // Start the download
            const downloadUrl = "{{ url_for('download_roadmap', job_role=job_role) }}";
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = true;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Redirect to dashboard after a short delay
            setTimeout(() => {
                window.location.href = "{{ url_for('dashboard') }}";
            }, 1000);
        }
    </script>
</body>
</html>
