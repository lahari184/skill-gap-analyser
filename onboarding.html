<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - Skill Gap Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .onboarding-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .welcome-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #bdc3c7;
        }

        .help-text {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
            color: white;
        }

        .skip-link {
            text-align: center;
            margin-top: 20px;
        }

        .skip-link a {
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .skip-link a:hover {
            color: #667eea;
        }

        @media (max-width: 600px) {
            .onboarding-container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="onboarding-container">
    <div class="header">
        <h1>👋 Welcome, {{ user_name }}!</h1>
        <p>Let's set up your profile</p>
    </div>

    <div class="welcome-message">
        Complete your profile to get personalized skill gap analysis and recommendations.
    </div>

    <form method="POST" action="{{ url_for('save_onboarding') }}">
        <div class="form-group">
            <label for="desired_job">Desired Job Role</label>
            <input 
                type="text" 
                id="desired_job" 
                name="desired_job" 
                placeholder="e.g., Frontend Developer, Data Scientist, DevOps Engineer"
                required
            >
            <div class="help-text">Enter the position you're aiming for</div>
        </div>

        <div class="form-group">
            <label for="skills">Your Skills</label>
            <textarea 
                id="skills" 
                name="skills" 
                placeholder="List your skills separated by commas&#10;e.g., HTML, CSS, JavaScript, React, Python"
                required
            ></textarea>
            <div class="help-text">Enter your current skills separated by commas</div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Continue to Dashboard</button>
            <button type="button" class="btn btn-secondary" onclick="skipOnboarding()">Skip for Now</button>
        </div>
    </form>

    <div class="skip-link">
        <p>You can update your profile anytime from the Profile section</p>
    </div>
</div>

<script>
    function skipOnboarding() {
        window.location.href = "{{ url_for('dashboard') }}";
    }
</script>

</body>
</html>
