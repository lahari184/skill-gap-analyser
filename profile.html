<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile | Skill Gap Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Skill Gap Analyzer</a>
        <span class="ms-auto">
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
        </span>
    </div>
</nav>

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <h3 class="text-center mb-4">Your Profile</h3>
                    <form method="POST" action="{{ url_for('profile') }}">
                        <div class="mb-3">
                            <label class="form-label">Current Skills (comma-separated)</label>
                            <textarea class="form-control" name="skills" rows="3" required>{{ skills }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Desired Job (optional)</label>
                            <input type="text" class="form-control" name="desired_job" value="{{ desired_job }}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save</button>
                    </form>
                    <p class="text-center mt-3">
                        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
